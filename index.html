<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Server Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<!-- Datum/Zeit-Adapter: nötig, damit die x-Achse eine echte Zeitskala ist
     (Abstand zwischen Punkten = tatsächlich vergangene Zeit) statt nur
     gleich große Kästchen pro Ereignis. -->
<script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1/dist/chartjs-adapter-luxon.umd.min.js"></script>
<!-- hammer.js: wird von chartjs-plugin-zoom für Touch-Gesten (Ziehen/Pinch)
     benötigt. Ohne diese Zeile funktioniert Zoomen/Verschieben per Finger
     nicht - nur die Maus-Rad-Zoom-Funktion würde gehen. -->
<script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
<style>
  :root {
    --navy: #1c3a54;
    --gold: #b8863a;
    --bg: #faf9f6;
    --card: #ffffff;
    --line: #e8e6df;
    --text: #1c1c1c;
    --muted: #8b8b82;
    --green: #3f7d5c;
    --red: #a13d3d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Jost', sans-serif;
    padding: 2.25rem 1.5rem;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 980px; margin: 0 auto; }

  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 1.9rem;
    margin: 0 0 1.1rem;
    color: var(--navy);
  }

  .stats-row {
    display: flex;
    flex-wrap: wrap;
    gap: 1.6rem 2.4rem;
    margin-bottom: 1.4rem;
  }
  .stat-item { display: flex; align-items: flex-start; gap: 0.5rem; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; margin-top: 0.4rem; }
  .stat-main { display: flex; flex-direction: column; gap: 0.15rem; }
  .stat-line1 { display: flex; align-items: baseline; gap: 0.4rem; flex-wrap: wrap; }
  .stat-name { font-size: 0.92rem; font-weight: 500; }
  .stat-value { font-size: 1.05rem; font-weight: 600; color: var(--navy); }
  .stat-unit { font-size: 0.76rem; color: var(--muted); }
  .stat-delta { font-size: 0.76rem; color: var(--muted); }
  .stat-delta.up { color: var(--green); }
  .stat-delta.down { color: var(--red); }
  .stat-line2 { font-size: 0.72rem; color: var(--muted); }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 1.3rem 1.4rem 1.1rem;
  }
  .card-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.75rem;
  }
  .toggle {
    display: flex;
    border: 1px solid var(--line);
    border-radius: 5px;
    overflow: hidden;
  }
  .mode-btn {
    font-family: 'Jost', sans-serif;
    font-size: 0.78rem;
    padding: 0.32rem 0.8rem;
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
  }
  .mode-btn.active { background: var(--navy); color: #fff; }
  .mode-btn:not(.active):hover { color: var(--navy); }

  #reset-zoom {
    display: inline-flex;
    align-items: center;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 4px;
    width: 28px; height: 28px;
    justify-content: center;
    cursor: pointer;
  }
  #reset-zoom:hover { color: var(--navy); border-color: var(--navy); }
  #reset-zoom svg { width: 13px; height: 13px; }

  #chart-wrap { position: relative; height: 400px; }
  /* Ohne das hier hier klaut der Browser Touch-Gesten (Scrollen/Pinch) auf
     dem Canvas, bevor chartjs-plugin-zoom/hammer.js sie verarbeiten kann -
     dadurch lässt sich der Graph auf dem Handy nicht verschieben/zoomen. */
  #chart { touch-action: none; }
  @media (max-width: 600px) {
    #chart-wrap { height: 300px; }
    .stats-row { gap: 1rem 1.6rem; }
  }

  .empty, .error {
    text-align: center;
    color: var(--muted);
    padding: 3rem 1rem;
    font-size: 0.92rem;
  }
  .error { color: var(--red); }
</style>
</head>
<body>

<div class="wrap">
  <h1>Server Tracker</h1>

  <div class="stats-row" id="stats"></div>

  <div class="card">
    <div class="card-head">
      <div class="toggle" id="mode-toggle">
        <button type="button" class="mode-btn active" data-mode="total">Total</button>
        <button type="button" class="mode-btn" data-mode="change">Change</button>
        <button type="button" class="mode-btn" data-mode="online">Online</button>
      </div>
      <button id="reset-zoom" type="button" title="Scroll to zoom, drag to pan · reset zoom">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/></svg>
      </button>
    </div>
    <div id="chart-wrap">
      <canvas id="chart"></canvas>
    </div>
  </div>
</div>

<script>
const COLORS = ['#1c3a54', '#b8863a', '#4c6b5e', '#8a5a6b'];

// Zeitzone & Zieluhrzeit für die tägliche Stichprobe bei "Total"/"Change":
// 22:00 Uhr deutscher Zeit. Läuft über die Intl-API und berücksichtigt damit
// automatisch die Umstellung zwischen Sommer- und Winterzeit - kein
// manuelles Nachjustieren von UTC-Offsets nötig.
const TARGET_TIMEZONE = 'Europe/Berlin';
const TARGET_HOUR_LOCAL = 22;
const TARGET_MINUTE_LOCAL = 0;

// Optional: Anzeigenamen manuell überschreiben (hat Vorrang vor dem von
// Discord gelieferten Namen).
const NAME_OVERRIDES = {
  // 'server_1': 'Actual Server Name',
};

async function loadHistory() {
  const res = await fetch('data/member-counts.json', { cache: 'no-store' });
  if (!res.ok) throw new Error(`Request failed (${res.status})`);
  const raw = await res.json();

  // Robust gegenüber dem alten Datenformat (reines Array), falls diese
  // Seite geladen wird, bevor der erste Lauf mit dem neuen Skript
  // durchgelaufen ist.
  if (Array.isArray(raw)) {
    const meta = {};
    const history = raw.map(entry => {
      const servers = {};
      for (const [code, s] of Object.entries(entry.servers || {})) {
        if (s.id || s.name || s.label) {
          meta[code] = { id: s.id ?? null, name: s.name ?? s.label ?? null };
        }
        servers[code] = s.error
          ? { error: s.error }
          : { member_count: s.member_count ?? null, online_count: s.online_count ?? null };
      }
      return { timestamp: entry.timestamp, servers };
    });
    return { meta, history };
  }

  return { meta: raw.meta || {}, history: raw.history || [] };
}

function niceName(code) {
  return code.replace(/[-_]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

function resolveName(code, meta) {
  return NAME_OVERRIDES[code] || meta[code]?.name || niceName(code);
}

function collectServers(meta, history) {
  const map = new Map();
  for (const code of Object.keys(meta)) {
    map.set(code, resolveName(code, meta));
  }
  for (const entry of history) {
    for (const code of Object.keys(entry.servers || {})) {
      if (!map.has(code)) map.set(code, resolveName(code, meta));
    }
  }
  return map;
}

// YYYY-MM-DD in der Zielzeitzone - Gruppierungsschlüssel für "ein Tag".
function localDateKey(date, timeZone) {
  return new Intl.DateTimeFormat('en-CA', { timeZone }).format(date);
}

// Minuten seit Mitternacht in der Zielzeitzone.
function localMinutesOfDay(date, timeZone) {
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone, hour: '2-digit', minute: '2-digit', hour12: false
  }).formatToParts(date);
  const hour = Number(parts.find(p => p.type === 'hour').value) % 24;
  const minute = Number(parts.find(p => p.type === 'minute').value);
  return hour * 60 + minute;
}

// Wählt pro Kalendertag (deutsche Zeit) genau eine Abfrage aus: die, deren
// Uhrzeit 22:00 Uhr am nächsten liegt. So ergibt sich aus den
// unregelmäßigen Cron-Läufen trotzdem eine konsistente
// "einmal täglich zur selben Zeit"-Reihe für Total/Change.
// Hinweis: Es wird EIN Eintrag pro Tag für beide Server gemeinsam gewählt
// (nicht pro Server einzeln optimiert) - schlägt die Abfrage für einen
// Server an genau diesem Zeitpunkt fehl, entsteht für diesen Tag eine
// Lücke, auch wenn zu einem anderen Zeitpunkt desselben Tages Daten für
// diesen Server vorlägen.
function pickDailySamples(history) {
  const targetMinutes = TARGET_HOUR_LOCAL * 60 + TARGET_MINUTE_LOCAL;
  const byDay = new Map();
  for (const entry of history) {
    const date = new Date(entry.timestamp);
    const dayKey = localDateKey(date, TARGET_TIMEZONE);
    const diff = Math.abs(localMinutesOfDay(date, TARGET_TIMEZONE) - targetMinutes);

    const current = byDay.get(dayKey);
    if (!current || diff < current.diff) {
      byDay.set(dayKey, { entry, diff });
    }
  }
  return [...byDay.values()]
    .map(v => v.entry)
    .sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
}

// 7-Tage-Vergleich auf Basis der täglichen Stichprobe (nicht der rohen,
// unregelmäßigen Abfragen) - sonst vergleicht man je nach Abfragefrequenz
// nur die letzten paar Stunden statt 7 Tage. Liegen noch keine 7 Tage an
// Daten vor, wird schlicht noch kein Delta angezeigt (–).
function getDelta(dailyHistory, code) {
  const lastIdx = dailyHistory.length - 1;
  const compareIdx = lastIdx - 7;
  if (compareIdx < 0) return null;
  const latest = dailyHistory[lastIdx].servers?.[code]?.member_count;
  const compare = dailyHistory[compareIdx].servers?.[code]?.member_count;
  if (typeof latest !== 'number' || typeof compare !== 'number') return null;
  return latest - compare;
}

function deltaMarkup(delta) {
  if (delta === null) return { text: '–', cls: '' };
  if (delta > 0) return { text: `▲ ${delta.toLocaleString('en-US')} · 7d`, cls: 'up' };
  if (delta < 0) return { text: `▼ ${Math.abs(delta).toLocaleString('en-US')} · 7d`, cls: 'down' };
  return { text: 'No change · 7d', cls: '' };
}

// Durchschnitt/Min/Max der Online-Zahl über die letzten 7 Tage, basierend
// auf ALLEN rohen Abfragen (nicht nur der täglichen Stichprobe) - dadurch
// ist der Durchschnitt aussagekräftiger als mit nur 7 Einzelwerten.
function onlineStats7d(history, code) {
  const cutoff = Date.now() - 7 * 24 * 60 * 60 * 1000;
  const values = history
    .filter(e => new Date(e.timestamp).getTime() >= cutoff)
    .map(e => e.servers?.[code]?.online_count)
    .filter(v => typeof v === 'number');
  if (!values.length) return null;
  const avg = Math.round(values.reduce((a, b) => a + b, 0) / values.length);
  return { avg, min: Math.min(...values), max: Math.max(...values) };
}

function renderStats(dailyHistory, history, servers) {
  const el = document.getElementById('stats');
  const latestDaily = dailyHistory[dailyHistory.length - 1];
  let html = '';
  let i = 0;
  for (const [code, label] of servers.entries()) {
    const count = latestDaily?.servers?.[code]?.member_count;
    const delta = deltaMarkup(getDelta(dailyHistory, code));
    const online = onlineStats7d(history, code);
    const onlineLine = online
      ? `Online members: ø ${online.avg.toLocaleString('en-US')} · min ${online.min.toLocaleString('en-US')} · max ${online.max.toLocaleString('en-US')} (7d)`
      : '';
    html += `<div class="stat-item">
      <span class="dot" style="background:${COLORS[i % COLORS.length]}"></span>
      <div class="stat-main">
        <div class="stat-line1">
          <span class="stat-name">${label}</span>
          <span class="stat-value">${typeof count === 'number' ? count.toLocaleString('en-US') : '–'}</span>
          <span class="stat-unit">members</span>
          <span class="stat-delta ${delta.cls}">${delta.text}</span>
        </div>
        ${onlineLine ? `<div class="stat-line2">${onlineLine}</div>` : ''}
      </div>
    </div>`;
    i++;
  }
  el.innerHTML = html;
}

// {x,y}-Punkte für Total/Change, gebaut aus der täglichen Stichprobe.
function buildDailySeries(dailyHistory, servers) {
  const totalData = {};
  const changeData = {};
  for (const [code] of servers.entries()) {
    const points = dailyHistory.map(e => ({
      t: new Date(e.timestamp).getTime(),
      v: e.servers?.[code]?.member_count ?? null
    }));
    totalData[code] = points.map(p => ({ x: p.t, y: p.v }));
    changeData[code] = points.map((p, i) => {
      if (i === 0) return { x: p.t, y: null };
      const prev = points[i - 1].v;
      const v = (typeof p.v === 'number' && typeof prev === 'number') ? p.v - prev : null;
      return { x: p.t, y: v };
    });
  }
  return { totalData, changeData };
}

// {x,y}-Punkte für den Online-Modus, aus ALLEN rohen Abfragen - hier soll
// bewusst auch die Entwicklung innerhalb eines Tages sichtbar sein. Da die
// x-Achse eine echte Zeitskala ist, steht der Abstand zwischen zwei Punkten
// automatisch im richtigen Verhältnis zur tatsächlich vergangenen Zeit.
function buildOnlineSeries(history, servers) {
  const onlineData = {};
  for (const [code] of servers.entries()) {
    onlineData[code] = history.map(e => ({
      x: new Date(e.timestamp).getTime(),
      y: e.servers?.[code]?.online_count ?? null
    }));
  }
  return { onlineData };
}

function makeDatasets(servers, dataMap) {
  return [...servers.entries()].map(([code, label], i) => ({
    label,
    data: dataMap[code],
    borderColor: COLORS[i % COLORS.length],
    backgroundColor: COLORS[i % COLORS.length],
    spanGaps: true,
    tension: 0.25,
    pointRadius: 2,
    pointHoverRadius: 4,
    borderWidth: 2
  }));
}

// Zeitachsen-Konfiguration je Modus. "Total"/"Change" zeigen einen Punkt
// pro Tag, "Online" stündliche Rasterlinien alle 3 Stunden (0/3/6/.../21
// Uhr) - der Abstand zwischen den Ereignissen entspricht dabei immer der
// tatsächlich vergangenen Zeit statt gleich großer Kästchen pro Ereignis.
const TIME_CONFIG = {
  daily: {
    unit: 'day',
    displayFormats: { day: 'MMM d' },
    tooltipFormat: 'MMM d, yyyy'
  },
  online: {
    unit: 'hour',
    stepSize: 3,
    displayFormats: { hour: 'MMM d, HH:mm' },
    tooltipFormat: 'MMM d, yyyy HH:mm'
  }
};

let chartInstance = null;

function renderChart(datasets, timeConfig) {
  chartInstance = new Chart(document.getElementById('chart'), {
    type: 'line',
    data: { datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 300 },
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: {
          position: 'top',
          labels: { font: { family: 'Jost', size: 12 }, boxWidth: 14, usePointStyle: true, pointStyle: 'line' }
        },
        tooltip: { titleFont: { family: 'Jost' }, bodyFont: { family: 'Jost' } },
        zoom: {
          zoom: { wheel: { enabled: true }, pinch: { enabled: true }, mode: 'x' },
          pan: { enabled: true, mode: 'x' },
          limits: { x: { min: 'original', max: 'original' } }
        }
      },
      scales: {
        x: {
          type: 'time',
          time: timeConfig,
          grid: { color: '#efefe9' },
          ticks: { font: { family: 'Jost', size: 11 } }
        },
        y: { grid: { color: '#efefe9' }, ticks: { font: { family: 'Jost', size: 11 } }, beginAtZero: false }
      }
    }
  });
}

document.getElementById('reset-zoom').addEventListener('click', () => {
  if (chartInstance) chartInstance.resetZoom();
});

loadHistory()
  .then(({ meta, history }) => {
    if (!history.length) {
      document.querySelector('.wrap').innerHTML =
        '<p class="empty">No data yet — the first snapshot lands after the next scheduled run.</p>';
      return;
    }

    const servers = collectServers(meta, history);
    const dailyHistory = pickDailySamples(history);

    const daily = buildDailySeries(dailyHistory, servers);
    const online = buildOnlineSeries(history, servers);

    renderStats(dailyHistory, history, servers);
    renderChart(makeDatasets(servers, daily.totalData), TIME_CONFIG.daily);

    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const mode = btn.dataset.mode;

        if (mode === 'online') {
          chartInstance.data.datasets = makeDatasets(servers, online.onlineData);
          chartInstance.options.scales.x.time = TIME_CONFIG.online;
        } else {
          chartInstance.data.datasets = makeDatasets(servers, mode === 'total' ? daily.totalData : daily.changeData);
          chartInstance.options.scales.x.time = TIME_CONFIG.daily;
        }
        chartInstance.resetZoom();
        chartInstance.update();
      });
    });
  })
  .catch(err => {
    document.querySelector('.wrap').innerHTML =
      `<p class="error">Could not load data: ${err.message}<br>
      If opened directly (file://), the browser likely blocks local requests —
      serve via a local web server or GitHub Pages instead.</p>`;
  });
</script>

</body>
</html>
