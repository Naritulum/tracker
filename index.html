<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Server Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<!-- Datum/Zeit-Adapter: nötig, damit die x-Achse eine echte Zeitskala ist
     (Abstand zwischen Punkten = tatsächlich vergangene Zeit) statt nur
     gleich große Kästchen pro Ereignis. -->
<script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1/dist/chartjs-adapter-luxon.umd.min.js"></script>
<!-- hammer.js: wird von chartjs-plugin-zoom für Touch-Gesten (Ziehen/Pinch)
     benötigt. Ohne diese Zeile funktioniert Zoomen/Verschieben per Finger
     nicht - nur die Maus-Rad-Zoom-Funktion würde gehen. -->
<script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
<style>
  :root {
    --navy: #1c3a54;
    --gold: #b8863a;
    --bg: #faf9f6;
    --card: #ffffff;
    --line: #e8e6df;
    --text: #1c1c1c;
    --muted: #8b8b82;
    --green: #3f7d5c;
    --red: #a13d3d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Jost', sans-serif;
    padding: 2.25rem 1.5rem;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 980px; margin: 0 auto; }

  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 1.9rem;
    margin: 0 0 1.1rem;
    color: var(--navy);
  }

  .stats-row {
    display: flex;
    flex-wrap: wrap;
    gap: 1.6rem 2.4rem;
    margin-bottom: 1.4rem;
  }
  .stat-item { display: flex; align-items: flex-start; gap: 0.5rem; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; margin-top: 0.4rem; }
  .stat-main { display: flex; flex-direction: column; gap: 0.15rem; }
  .stat-line1 { display: flex; align-items: baseline; gap: 0.4rem; flex-wrap: wrap; }
  .stat-name { font-size: 0.92rem; font-weight: 500; }
  .stat-value { font-size: 1.05rem; font-weight: 600; color: var(--navy); }
  .stat-unit { font-size: 0.76rem; color: var(--muted); }
  .stat-delta { font-size: 0.76rem; color: var(--muted); }
  .stat-delta.up { color: var(--green); }
  .stat-delta.down { color: var(--red); }
  .stat-line2 { font-size: 0.72rem; color: var(--muted); }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 1.3rem 1.4rem 1.1rem;
  }
  .card-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.75rem;
  }
  .toggle {
    display: flex;
    border: 1px solid var(--line);
    border-radius: 5px;
    overflow: hidden;
  }
  .mode-btn {
    font-family: 'Jost', sans-serif;
    font-size: 0.78rem;
    padding: 0.32rem 0.8rem;
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
  }
  .mode-btn.active { background: var(--navy); color: #fff; }
  .mode-btn:not(.active):hover { color: var(--navy); }

  #reset-zoom {
    display: inline-flex;
    align-items: center;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 4px;
    width: 28px; height: 28px;
    justify-content: center;
    cursor: pointer;
  }
  #reset-zoom:hover { color: var(--navy); border-color: var(--navy); }
  #reset-zoom svg { width: 13px; height: 13px; }

  #chart-wrap { position: relative; height: 400px; }
  /* Ohne das hier hier klaut der Browser Touch-Gesten (Scrollen/Pinch) auf
     dem Canvas, bevor chartjs-plugin-zoom/hammer.js sie verarbeiten kann -
     dadurch lässt sich der Graph auf dem Handy nicht verschieben/zoomen. */
  #chart { touch-action: none; }
  @media (max-width: 600px) {
    #chart-wrap { height: 300px; }
    .stats-row { gap: 1rem 1.6rem; }
  }

  .empty, .error {
    text-align: center;
    color: var(--muted);
    padding: 3rem 1rem;
    font-size: 0.92rem;
  }
  .error { color: var(--red); }
</style>
</head>
<body>

<div class="wrap">
  <h1>Server Tracker</h1>

  <div class="stats-row" id="stats"></div>

  <div class="card">
    <div class="card-head">
      <div class="toggle" id="mode-toggle">
        <button type="button" class="mode-btn active" data-mode="total">Total</button>
        <button type="button" class="mode-btn" data-mode="change">Change</button>
        <button type="button" class="mode-btn" data-mode="online">Online</button>
      </div>
      <button id="reset-zoom" type="button" title="Scroll to zoom, drag to pan · reset zoom">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/></svg>
      </button>
    </div>
    <div id="chart-wrap">
      <canvas id="chart"></canvas>
    </div>
  </div>
</div>

<script>
const COLORS = ['#1c3a54', '#b8863a', '#4c6b5e', '#8a5a6b'];

// Zeitzone, die einen "Kalendertag" für die tägliche Stichprobe bei
// "Total"/"Change" definiert (00:00-23:59:59 deutscher Zeit). Läuft über
// Luxon und berücksichtigt damit automatisch die Umstellung zwischen
// Sommer- und Winterzeit.
const TARGET_TIMEZONE = 'Europe/Berlin';

// id und Name eines Servers bleiben über den Einladungslink hinweg konstant
// (siehe fetch-members.js) - deshalb hier fest hinterlegt statt aus den
// Daten gelesen.
//
// WICHTIG: Die Reihenfolge dieser Liste ist Teil des Datenformats (jede
// Spalte in der CSV-Datei ist eine Position, kein Schlüssel) und MUSS mit
// der SERVERS-Reihenfolge in fetch-members.js übereinstimmen. Bestehende
// Einträge nie umsortieren oder löschen - neue Server nur ans Ende anhängen.
const SERVERS = [
  { code: 'uuBEVU9anf', name: 'PhantasiaCraft' },
  { code: 'jfHRUSYzp8', name: 'McThemeParks' }
];

// --- Kompaktes Zahlenformat: Basis-64-Ziffern statt Basis-10, dadurch
// deutlich weniger Zeichen pro Zahl. "0" steht für den Wert 0, danach
// 1-9, A-Z, a-z, -, _ für höhere Werte (identisch zu fetch-members.js). ---
const B64_DIGITS = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz-_';

// Zigzag-Dekodierung: kehrt die Abbildung 0→0, -1→1, 1→2, -2→3, 2→4, ...
// um, damit auch negative Deltas ohne eigenes Vorzeichen-Zeichen auskommen.
function zigzagDecode(z) {
  return z % 2 === 0 ? z / 2 : -(z + 1) / 2;
}

function decodeNumber(str) {
  let z = 0;
  for (const ch of str) z = z * 64 + B64_DIGITS.indexOf(ch);
  return zigzagDecode(z);
}

// Liest data/member-counts.csv: jede Zeile enthält t,m0,o0,m1,o1,... - jeder
// Wert ist ein Delta zum letzten bekannten Wert SEINER Spalte (nicht zur
// Vorzeile!). Ein leeres Feld bedeutet "bei diesem Lauf kein Wert" (z.B.
// API-Fehler) und lässt den letzten bekannten Stand dieser Spalte
// unverändert, bis wieder ein Wert vorliegt.
function parseCsv(raw) {
  const t0State = { t: null, servers: SERVERS.map(() => ({ m: null, o: null })) };
  const history = [];

  for (const line of raw.split('\n')) {
    if (!line) continue;
    const fields = line.split(',');

    if (fields[0] !== '') {
      const d = decodeNumber(fields[0]);
      t0State.t = t0State.t === null ? d : t0State.t + d;
    }

    const servers = {};
    for (let i = 0; i < SERVERS.length; i++) {
      const mField = fields[1 + i * 2];
      const oField = fields[2 + i * 2];
      const s = t0State.servers[i];

      if (mField) {
        const d = decodeNumber(mField);
        s.m = s.m === null ? d : s.m + d;
      }
      if (oField) {
        const d = decodeNumber(oField);
        s.o = s.o === null ? d : s.o + d;
      }
      servers[SERVERS[i].code] = { member_count: s.m, online_count: s.o };
    }

    history.push({ timestamp: t0State.t * 1000, servers });
  }

  return history;
}

async function loadHistory() {
  const res = await fetch('data/member-counts.csv', { cache: 'no-store' });
  if (!res.ok) throw new Error(`Request failed (${res.status})`);
  const raw = await res.text();
  return parseCsv(raw);
}

function collectServers() {
  return new Map(SERVERS.map(s => [s.code, s.name]));
}

// Ein Unix-Zeitstempel (Millisekunden), dargestellt in der Zielzeitzone.
function berlinDate(ms) {
  return luxon.DateTime.fromMillis(ms).setZone(TARGET_TIMEZONE);
}

// Wählt pro Kalendertag (deutsche Zeit, 00:00-23:59:59) genau eine Abfrage
// aus: die späteste des Tages. "dayStart" (00:00 Uhr deutscher Zeit dieses
// Tages) ist die Position im Graphen - die tatsächliche Uhrzeit der Abfrage
// beeinflusst den Abstand zwischen den Tagen also NICHT, jeder Tag bekommt
// exakt einen gleich weit entfernten Platz auf der Achse. Die echte Uhrzeit
// bleibt trotzdem an "timestamp" erhalten und taucht im Tooltip auf.
// Hinweis: Es wird EIN Eintrag pro Tag für beide Server gemeinsam gewählt
// (nicht pro Server einzeln optimiert) - schlägt die Abfrage für einen
// Server beim letzten Lauf des Tages fehl, gilt das auch für diesen Server,
// selbst wenn er bei einem früheren Lauf desselben Tages Daten geliefert hätte.
function pickDailySamples(history) {
  const latestPerDay = new Map();
  for (const entry of history) {
    const dayKey = berlinDate(entry.timestamp).toFormat('yyyy-MM-dd');
    const current = latestPerDay.get(dayKey);
    if (!current || entry.timestamp > current.timestamp) {
      latestPerDay.set(dayKey, entry);
    }
  }
  return [...latestPerDay.entries()]
    .map(([dayKey, entry]) => ({
      dayStart: luxon.DateTime.fromFormat(dayKey, 'yyyy-MM-dd', { zone: TARGET_TIMEZONE }).toMillis(),
      timestamp: entry.timestamp,
      servers: entry.servers
    }))
    .sort((a, b) => a.dayStart - b.dayStart);
}

// 7-Tage-Vergleich auf Basis der täglichen Stichprobe (nicht der rohen,
// unregelmäßigen Abfragen) - sonst vergleicht man je nach Abfragefrequenz
// nur die letzten paar Stunden statt 7 Tage. Liegen noch keine 7 Tage an
// Daten vor, wird schlicht noch kein Delta angezeigt (–).
function getDelta(dailyHistory, code) {
  const lastIdx = dailyHistory.length - 1;
  const compareIdx = lastIdx - 7;
  if (compareIdx < 0) return null;
  const latest = dailyHistory[lastIdx].servers?.[code]?.member_count;
  const compare = dailyHistory[compareIdx].servers?.[code]?.member_count;
  if (typeof latest !== 'number' || typeof compare !== 'number') return null;
  return latest - compare;
}

function deltaMarkup(delta) {
  if (delta === null) return { text: '–', cls: '' };
  if (delta > 0) return { text: `▲ ${delta.toLocaleString('en-US')} · 7d`, cls: 'up' };
  if (delta < 0) return { text: `▼ ${Math.abs(delta).toLocaleString('en-US')} · 7d`, cls: 'down' };
  return { text: 'No change · 7d', cls: '' };
}

// Durchschnitt/Min/Max der Online-Zahl über die letzten 7 Tage, basierend
// auf ALLEN rohen Abfragen (nicht nur der täglichen Stichprobe) - dadurch
// ist der Durchschnitt aussagekräftiger als mit nur 7 Einzelwerten.
function onlineStats7d(history, code) {
  const cutoff = Date.now() - 7 * 24 * 60 * 60 * 1000;
  const values = history
    .filter(e => e.timestamp >= cutoff)
    .map(e => e.servers?.[code]?.online_count)
    .filter(v => typeof v === 'number');
  if (!values.length) return null;
  const avg = Math.round(values.reduce((a, b) => a + b, 0) / values.length);
  return { avg, min: Math.min(...values), max: Math.max(...values) };
}

function renderStats(dailyHistory, history, servers) {
  const el = document.getElementById('stats');
  // Bewusst unabhängig von der täglichen Stichprobe des Graphen: hier soll
  // immer der aktuellste bekannte Wert stehen, egal wie der Graph seine
  // Tagespunkte auswählt.
  const latestRaw = history[history.length - 1];
  let html = '';
  let i = 0;
  for (const [code, label] of servers.entries()) {
    const count = latestRaw?.servers?.[code]?.member_count;
    const delta = deltaMarkup(getDelta(dailyHistory, code));
    const online = onlineStats7d(history, code);
    const onlineLine = online
      ? `Online members: ø ${online.avg.toLocaleString('en-US')} · min ${online.min.toLocaleString('en-US')} · max ${online.max.toLocaleString('en-US')} (7d)`
      : '';
    html += `<div class="stat-item">
      <span class="dot" style="background:${COLORS[i % COLORS.length]}"></span>
      <div class="stat-main">
        <div class="stat-line1">
          <span class="stat-name">${label}</span>
          <span class="stat-value">${typeof count === 'number' ? count.toLocaleString('en-US') : '–'}</span>
          <span class="stat-unit">members</span>
          <span class="stat-delta ${delta.cls}">${delta.text}</span>
        </div>
        ${onlineLine ? `<div class="stat-line2">${onlineLine}</div>` : ''}
      </div>
    </div>`;
    i++;
  }
  el.innerHTML = html;
}

// Schneidet am Anfang und am Ende der Reihe alle Punkte weg, an denen KEIN
// Server einen Wert hat - sonst würde dort trotzdem ein Datum auf der
// x-Achse reserviert, ohne dass ein Punkt sichtbar ist. Das betrifft vor
// allem "Change": der allererste Tag hat serverübergreifend immer keinen
// Change-Wert, da ein Vorwert zum Vergleich fehlt. Lücken MITTEN in der
// Reihe bleiben unangetastet - die zeigt "spanGaps" bereits korrekt an.
function trimEdgeGaps(dataMap) {
  const codes = Object.keys(dataMap);
  if (!codes.length) return dataMap;
  const len = dataMap[codes[0]].length;
  const hasAnyValue = i => codes.some(code => typeof dataMap[code][i]?.y === 'number');

  let start = 0;
  while (start < len && !hasAnyValue(start)) start++;
  let end = len - 1;
  while (end >= start && !hasAnyValue(end)) end--;

  const trimmed = {};
  for (const code of codes) trimmed[code] = dataMap[code].slice(start, end + 1);
  return trimmed;
}

// {x,y}-Punkte für Total/Change, gebaut aus der täglichen Stichprobe. x ist
// immer der Tagesbeginn (00:00 Uhr deutscher Zeit) - dadurch liegt jeder Tag
// exakt auf seiner Linie, unabhängig davon, um wieviel Uhr die zugrunde
// liegende Abfrage tatsächlich lief. "actualTimestamp" trägt die echte
// Abfragezeit mit, damit der Tooltip sie anzeigen kann.
function buildDailySeries(dailyHistory, servers) {
  const totalData = {};
  const changeData = {};
  for (const [code] of servers.entries()) {
    const counts = dailyHistory.map(d => d.servers?.[code]?.member_count ?? null);
    totalData[code] = dailyHistory.map((d, i) => ({
      x: d.dayStart, y: counts[i], actualTimestamp: d.timestamp
    }));
    changeData[code] = dailyHistory.map((d, i) => {
      const v = (i > 0 && typeof counts[i] === 'number' && typeof counts[i - 1] === 'number')
        ? counts[i] - counts[i - 1]
        : null;
      return { x: d.dayStart, y: v, actualTimestamp: d.timestamp };
    });
  }
  return { totalData: trimEdgeGaps(totalData), changeData: trimEdgeGaps(changeData) };
}

// {x,y}-Punkte für den Online-Modus, aus ALLEN rohen Abfragen - hier soll
// bewusst auch die Entwicklung innerhalb eines Tages sichtbar sein. Da die
// x-Achse eine echte Zeitskala ist, steht der Abstand zwischen zwei Punkten
// automatisch im richtigen Verhältnis zur tatsächlich vergangenen Zeit.
function buildOnlineSeries(history, servers) {
  const onlineData = {};
  for (const [code] of servers.entries()) {
    onlineData[code] = history.map(e => ({
      x: e.timestamp,
      y: e.servers?.[code]?.online_count ?? null
    }));
  }
  return { onlineData: trimEdgeGaps(onlineData) };
}

function makeDatasets(servers, dataMap) {
  return [...servers.entries()].map(([code, label], i) => ({
    label,
    data: dataMap[code],
    borderColor: COLORS[i % COLORS.length],
    backgroundColor: COLORS[i % COLORS.length],
    spanGaps: true,
    tension: 0.25,
    pointRadius: 2,
    pointHoverRadius: 4,
    borderWidth: 2
  }));
}

// Zeitachsen-Konfiguration je Modus. "Total"/"Change" zeigen genau einen
// Punkt pro Tag, fest auf 00:00 Uhr positioniert (siehe pickDailySamples) -
// jeder Tag bekommt also denselben Abstand zum nächsten, unabhängig von der
// tatsächlichen Abfragezeit. "Online" zeigt Rasterlinien alle 3 Stunden
// (0/3/6/.../21 Uhr), hier entspricht der Punktabstand der tatsächlich
// vergangenen Zeit.
const TIME_CONFIG = {
  daily: {
    unit: 'day',
    displayFormats: { day: 'MMM d' }
  },
  online: {
    unit: 'hour',
    stepSize: 3,
    displayFormats: { hour: 'MMM d, HH:mm' }
  }
};

let chartInstance = null;

function renderChart(datasets, timeConfig) {
  chartInstance = new Chart(document.getElementById('chart'), {
    type: 'line',
    data: { datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 300 },
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: {
          position: 'top',
          labels: { font: { family: 'Jost', size: 12 }, boxWidth: 14, usePointStyle: true, pointStyle: 'line' }
        },
        tooltip: {
          titleFont: { family: 'Jost' },
          bodyFont: { family: 'Jost' },
          callbacks: {
            // Bei Total/Change codiert die x-Position nur noch den Tag, nicht
            // die Uhrzeit - darum zusätzlich anzeigen, von welcher Abfrage
            // (actualTimestamp) der verwendete Wert stammt. Beim Online-Modus
            // ist die x-Position bereits die echte Abfragezeit, da reicht das
            // normale Datum/Uhrzeit-Format.
            title(items) {
              if (!items.length) return '';
              const point = items[0].raw;
              if (point?.actualTimestamp) {
                const day = luxon.DateTime.fromMillis(items[0].parsed.x).setZone(TARGET_TIMEZONE).toFormat('MMM d, yyyy');
                const time = berlinDate(point.actualTimestamp).toFormat('HH:mm');
                return `${day} ${time}`;
              }
              return luxon.DateTime.fromMillis(items[0].parsed.x).setZone(TARGET_TIMEZONE).toFormat('MMM d, yyyy HH:mm');
            }
          }
        },
        zoom: {
          zoom: { wheel: { enabled: true }, pinch: { enabled: true }, mode: 'x' },
          pan: { enabled: true, mode: 'x' },
          limits: { x: { min: 'original', max: 'original' } }
        }
      },
      scales: {
        x: {
          type: 'time',
          time: timeConfig,
          grid: { color: '#efefe9' },
          ticks: { font: { family: 'Jost', size: 11 } }
        },
        y: { grid: { color: '#efefe9' }, ticks: { font: { family: 'Jost', size: 11 } }, beginAtZero: false }
      }
    }
  });
}

document.getElementById('reset-zoom').addEventListener('click', () => {
  if (chartInstance) chartInstance.resetZoom();
});

loadHistory()
  .then(history => {
    if (!history.length) {
      document.querySelector('.wrap').innerHTML =
        '<p class="empty">No data yet — the first snapshot lands after the next scheduled run.</p>';
      return;
    }

    const servers = collectServers();
    const dailyHistory = pickDailySamples(history);

    const daily = buildDailySeries(dailyHistory, servers);
    const online = buildOnlineSeries(history, servers);

    renderStats(dailyHistory, history, servers);
    renderChart(makeDatasets(servers, daily.totalData), TIME_CONFIG.daily);

    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const mode = btn.dataset.mode;

        if (mode === 'online') {
          chartInstance.data.datasets = makeDatasets(servers, online.onlineData);
          chartInstance.options.scales.x.time = TIME_CONFIG.online;
        } else {
          chartInstance.data.datasets = makeDatasets(servers, mode === 'total' ? daily.totalData : daily.changeData);
          chartInstance.options.scales.x.time = TIME_CONFIG.daily;
        }
        chartInstance.resetZoom();
        chartInstance.update();
      });
    });
  })
  .catch(err => {
    document.querySelector('.wrap').innerHTML =
      `<p class="error">Could not load data: ${err.message}<br>
  });
</script>

</body>
</html>
